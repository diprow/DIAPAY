name: ارسال دستی نرخ

# با هر تغییر فایل manual.json اجرا می‌شود:
# نرخ‌های داخل فایل را در کانال می‌فرستد و روی سایت (rates.json) می‌گذارد.
on:
  push:
    branches: [main]
    paths: ['manual.json']
  workflow_dispatch:

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ارسال نرخ دستی
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAND_EMOJI:   '💠'
          BRAND_NAME:    'دیاپی'
          BRAND_TAGLINE: 'تبدیل ارز بدون مرز'
          BRAND_CONTACT: '@diapayadmin'
          BRAND_LINK:    '@diapaychanel'
        run: python bot.py --manual manual.json

      - name: ذخیره نرخ سایت
        run: |
          if [[ -n "$(git status --porcelain rates.json)" ]]; then
            git config user.name  "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add rates.json
            git commit -m "chore: نرخ دستی روی سایت [skip ci]"
            git pull --rebase
            git push
          else
            echo "تغییری در rates.json نبود."
          fi
