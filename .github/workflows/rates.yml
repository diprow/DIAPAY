name: ارسال نرخ ارز به تلگرام

on:
  schedule:
    - cron: '30 5,9,12,16 * * *'
  workflow_dispatch:

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: run bot
        env:
          NAVASAN_API_KEY:    ${{ secrets.NAVASAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIT_DIVISOR:  '1'
          MIN_CHANGE_PCT: '0'
          TRIGGER_ITEMS: 'eur,usd'
        run: python bot.py

      - name: save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update rates [skip ci]"
            git push
          else
            echo "no change"
          fi
