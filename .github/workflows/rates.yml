name: ارسال نرخ ارز به تلگرام

on:
  schedule:
    # هر ساعت، از ۱۰ صبح تا ۵ عصر به وقت تهران — همه‌ی روزهای هفته
    # تهران: ۱۰ · ۱۱ · ۱۲ · ۱۳ · ۱۴ · ۱۵ · ۱۶ · ۱۷   (cron به UTC است؛ تهران = UTC+3:30)
    - cron: '30 6-13 * * *'
    #
    # ۸ نوبت در روز ≈ ۲۴۰ درخواست در ماه (پلن پولی لازم است)

  workflow_dispatch:      # امکان اجرای دستی از تب Actions

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # برای ذخیره state.json و rates.json (نرخ سایت)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: اجرای ربات
        env:
          NAVASAN_API_KEY:    ${{ secrets.NAVASAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # اگر مقادیر API ریال بودند این را 10 بگذارید
          UNIT_DIVISOR:  '1'
          # حداقل درصد تغییر برای ارسال پیام (مثلاً 0.2 = دو دهم درصد)
          MIN_CHANGE_PCT: '0'
          # فقط تغییر این آیتم‌ها باعث ارسال پیام می‌شود
          TRIGGER_ITEMS: 'eur,usd'
          # ---- امضای برند ----
          BRAND_EMOJI:   '💠'
          BRAND_NAME:    'دیاپی'
          BRAND_TAGLINE: 'تبدیل ارز بدون مرز'
          BRAND_CONTACT: '@diapayadmin'
          BRAND_LINK:    '@diapaychanel'
        run: python bot.py

      - name: ذخیره آخرین قیمت‌ها
        run: |
          if [[ -n "$(git status --porcelain state.json rates.json)" ]]; then
            git config user.name  "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add state.json rates.json
            git commit -m "chore: بروزرسانی آخرین نرخ‌ها [skip ci]"
            git push
          else
            echo "تغییری در فایل‌ها نبود."
          fi
